<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOW</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="np-body">
  <div id="np-root" class="np-dim">
    <div id="np-main">
      <div id="np-breadcrumb"></div>
      <div id="np-label"></div>
      <div id="np-todos" class="hidden"></div>
      <div id="np-elapsed">
        <span id="np-elapsed-text"></span>
        <span id="np-badge" class="hidden">interrupted</span>
      </div>
    </div>
    <div id="np-question" class="hidden">
      <span id="np-qtext"></span>
      <div class="np-q-actions">
        <button id="np-stay">stay</button>
        <button id="np-advance">advance</button>
      </div>
    </div>
    <div id="np-switch-form" class="hidden">
      <input type="text" id="np-reason" placeholder="reason (required)" autocomplete="off">
      <div class="np-switch-actions">
        <button id="np-switch-save" disabled>Save</button>
        <button id="np-switch-cancel">Cancel</button>
      </div>
    </div>
  </div>
  <script src="/static/panel.js"></script>
</body>
</html>
