<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- maximum-scale=1 kills iOS's focus-zoom: every input here is <16px, and
       zooming a position:fixed sheet paints the classic white void. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
  <title>Productivity Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <!-- Installable + offline (see static/sw.js). The manifest is served from the
       root because its scope defaults to its own directory, and start_url "/"
       has to sit inside that scope. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d0d0d">
  <!-- iOS ignores the manifest's icons for Add to Home Screen and reads this. -->
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
  <!-- 9c shell: the day is the whole screen; everything else is an overlay
       reached from the ≡ hub in the capture bar. -->
  <div id="app">
    <div id="engage-root">
      <div id="engage-header"></div>
      <div id="engage-body"></div>
      <!-- Catches taps outside the sheet so clicking off closes it (through the
           same closeClarify that now flushes notes) instead of hitting whatever
           surface is behind. -->
      <div id="clarify-backdrop" class="hidden"></div>
      <div id="clarify-sheet" class="hidden"></div>
    </div>
  </div>

  <!-- Hub rail (9c): the icon rail the ≡ button reveals -->
  <div id="hub-overlay" class="hidden">
    <div id="hub-rail">
      <button class="hub-btn" data-hub="calendar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Calendar</span>
      </button>
      <button class="hub-btn" data-hub="map">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 8 3 16 6 23 3 23 18 16 21 8 18 1 21"/><line x1="8" y1="3" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="21"/></svg>
        <span>MAP</span>
      </button>
      <button class="hub-btn review-nav-item" data-hub="lists" id="hub-lists-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>Lists</span>
      </button>
      <button class="hub-btn" data-hub="people">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>People</span>
      </button>
      <button class="hub-btn" data-hub="journal">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>Journal</span>
      </button>
      <button class="hub-btn review-nav-item" data-hub="social" id="hub-social-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <span>Social</span>
      </button>
      <button class="hub-btn" data-hub="logs">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>Logs</span>
      </button>
      <button class="hub-btn" data-hub="settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
      </button>
    </div>
  </div>

  <!-- Calendar overlay: the old Today-tab timeline, whole -->
  <div id="cal-overlay" class="m-overlay hidden">
    <div class="m-head">
      <span class="m-title">Calendar</span>
      <button class="modal-close-btn m-close" data-close="cal-overlay">✕</button>
    </div>
    <div id="cal-strips">
      <div id="deadlines-strip"></div>
      <div id="sheets-due-strip"></div>
    </div>
    <div id="right-panel">
      <div class="tl-header">
        <div class="tl-nav">
          <button class="tl-nav-btn" id="nav-prev">‹</button>
          <span id="tl-date-label"></span>
          <button class="tl-nav-btn" id="nav-next">›</button>
          <button class="tl-today-btn" id="nav-today">Today</button>
        </div>
        <div class="tl-refresh-area">
          <button class="tl-refresh-btn" id="tl-add-event">+ Event</button>
          <button class="tl-refresh-btn" id="refresh-btn">↻ Refresh</button>
          <span id="fetch-status"></span>
        </div>
      </div>
      <div id="tl-allday-strip"></div>
      <div id="tl-body">
        <div id="tl-grid"></div>
        <div id="tl-blocks-layer"></div>
        <div id="tl-gcal-layer"></div>
        <div id="tl-qr-layer"></div>
        <div id="tl-current-time"></div>
      </div>
    </div>
  </div>

  <!-- Full-screen NOW view: what the phone gets instead of the evergreen
       pywebview panel -->
  <div id="now-full" class="m-overlay hidden">
    <div class="m-head">
      <span class="m-title">NOW</span>
      <button class="modal-close-btn m-close" data-close="now-full">✕</button>
    </div>
    <div id="now-full-body"></div>
  </div>

  <div id="tab-people" class="m-overlay hidden">
    <div class="m-head">
      <span class="m-title">People</span>
      <button class="modal-close-btn m-close" data-close="tab-people">✕</button>
    </div>
    <div id="people-wrap">
      <div id="people-session-bar"></div>
      <div id="people-topbar">
        <div id="people-due-strip"></div>
        <div id="people-toolbar">
          <button id="people-add-btn" class="be-btn-primary">+ add person</button>
          <button id="people-buckets-btn" class="be-btn-secondary">Buckets</button>
        </div>
      </div>
      <div id="people-grid"></div>
    </div>
  </div>

  <!-- Routine runner: one step per page, over everything (incl. tab-lists). -->
  <div id="flow-run" class="hidden"></div>

  <!-- One context tag's configuration: device, location, time period.
       Opened by right-click / long-press on a tag chip in the ctx picker. -->
  <div id="ctx-sheet-backdrop" class="hidden"></div>
  <div id="ctx-sheet" class="hidden"></div>

  <!-- One routine step's settings, as a clarify-shaped sheet: the row on the
       list is text + badges + ›, and every SETTING is decided in here. -->
  <div id="fr-sheet-backdrop" class="hidden"></div>
  <div id="fr-sheet" class="hidden"></div>
  <div id="ev-sheet-backdrop" class="hidden"></div>
  <div id="ev-sheet" class="hidden"></div>
  <div id="en-sheet-backdrop" class="hidden"></div>
  <div id="en-sheet" class="hidden"></div>

  <!-- One OCCASION: the actions a kind of event always brings with it.
       Opened by tapping an event on the day. -->
  <div id="oc-sheet-backdrop" class="hidden"></div>
  <div id="oc-sheet" class="hidden"></div>

  <!-- Reference lists: GTD's non-actionable keeps (books, movies, gifts…).
       Deliberately outside the action inventory — no MAP row, no predicate. -->
  <div id="tab-lists" class="m-overlay hidden">
    <div class="m-head">
      <span class="m-title" id="ref-title">Lists</span>
      <button class="modal-close-btn m-close" data-close="tab-lists">✕</button>
    </div>
    <!-- THE WEEKLY REVIEW LIVES HERE (2026-08-16). The GTD tab is gone: its
         four lists were MAP's lenses said twice, and the review is a ROUTINE,
         so it belongs where the routines are. The fold-out keeps the live
         counts paper cannot compute — chiefly the projects with no next
         action — and ▶ runs the same flow_run the fold-out ticks into.
         Hidden while a list or routine is open (renderRef owns that). -->
    <button id="gtd-review-head" class="review-nav-item hidden">
      <span>Weekly review</span>
      <span id="gtd-review-prog" class="map-count"></span>
      <!-- An SVG, not a ▶: U+25B6 is picked up by the emoji font on Windows,
           which paints it blue whatever `color` says and sits it off the text's
           baseline. Drawn here it takes currentColor and centres exactly. -->
      <span id="gtd-review-run" class="gr-run" title="Run it as a routine — one step per page"><svg viewBox="0 0 12 12" width="11" height="11" fill="currentColor" aria-hidden="true"><path d="M2.5 1.2 L10.2 6 L2.5 10.8 Z"/></svg></span>
      <span class="gtd-review-chevron">⌄</span>
    </button>
    <div id="review-panel" class="hidden"></div>
    <div id="ref-body"></div>
  </div>

  <div id="tab-social" class="m-overlay hidden">
    <div class="m-head">
      <span class="m-title">Social</span>
      <button class="modal-close-btn m-close" data-close="tab-social">✕</button>
    </div>
    <div id="social-body"></div>
  </div>

  <div id="tab-journal" class="m-overlay hidden">
    <div class="m-head">
      <span class="m-title">Journal</span>
      <button class="modal-close-btn m-close" data-close="tab-journal">✕</button>
    </div>
    <div id="journal-wrap">
      <div id="journal-topbar">
        <div id="journal-habit"></div>
        <button id="journal-refresh" class="be-btn-secondary">↻ Sync</button>
      </div>
      <div id="journal-grid"></div>
    </div>
  </div>

  <!-- Dangerous writing: stop typing and the draft is destroyed. The ONE
       surface that covers the global bar (z 240) — capture during a session
       is exactly the task-switch the mechanic exists to punish. -->
  <div id="dw-session" class="hidden"></div>

  <!-- Logs modal -->
  <div id="logs-overlay" class="hidden">
    <div id="logs-modal">
      <!-- One filter menu behind one pill, same shape as MAP's (23a): the pill
           names what the list is showing, the menu is transient chrome and
           peels before the overlay. -->
      <div class="modal-header">
        <span class="modal-title" id="logs-title">Logs</span>
        <button id="logs-filter" class="map-filter-pill"></button>
        <button id="logs-close" class="modal-close-btn">✕</button>
      </div>
      <div id="logs-filter-menu" class="hidden"></div>
      <div id="logs-body"></div>
    </div>
  </div>

  <!-- Person detail panel -->
  <div id="person-detail-overlay" class="hidden">
    <div id="person-detail-modal">
      <div class="modal-header">
        <span class="modal-title" id="person-detail-title">Person</span>
        <button id="person-detail-close" class="modal-close-btn">✕</button>
      </div>
      <div id="person-detail-body"></div>
    </div>
  </div>

  <!-- Projects manager (GTD Horizon 1) -->
  <div id="map-overlay" class="hidden">
    <div id="map-modal">
      <!-- ONE filter menu in the header (23a): the LENS joins domain and tags
           in a single menu, so there is one place that narrows the list and no
           permanent band of chrome. The pill always names what you are looking
           at; the menu is transient and peels before the overlay. -->
      <div class="modal-header">
        <span class="modal-title">MAP</span>
        <button id="map-filter" class="map-filter-pill"></button>
        <button id="map-close" class="modal-close-btn">✕</button>
      </div>
      <div id="map-filter-menu" class="hidden"></div>
      <!-- Search over everything MAP shows, the clarify project search's
           matcher (relScore) on the whole inventory instead of projects. -->
      <div id="map-search-wrap">
        <input type="text" id="map-q" placeholder="⌕ search the inventory" autocomplete="off">
        <button id="map-sort" title="Sort order"></button>
        <span id="map-q-count" class="cl-hint"></span>
      </div>
      <div id="map-body"></div>
    </div>
  </div>

  <!-- Bucket manager -->
  <div id="bucket-mgr-overlay" class="hidden">
    <div id="bucket-mgr-modal">
      <div class="modal-header">
        <span class="modal-title">Buckets</span>
        <button id="bucket-mgr-close" class="modal-close-btn">✕</button>
      </div>
      <div id="bucket-mgr-body"></div>
    </div>
  </div>

  <!-- Add person -->
  <div id="person-add-overlay" class="hidden">
    <div id="person-add-modal">
      <div class="modal-header">
        <span class="modal-title" id="person-add-title">Add Person</span>
        <button id="person-add-close" class="modal-close-btn">✕</button>
      </div>
      <div id="person-add-body"></div>
    </div>
  </div>

  <!-- Settings modal (was: Block Editor). Three surfaces, one grammar
       (11a): the INDEX carries current state on every row; a SECTION is a
       plain list with one add affordance; adding and editing both raise
       #se-sheet, so a form never sits inside the scroll. Back is the only
       navigation. Ported from Claude Design (project
       82343144-9c74-405a-8a03-5d1a2c5b82c7, file GTD Panel Layouts.dc.html,
       panel 11a). -->
  <div id="modal-overlay" class="hidden">
    <div id="block-editor-modal">
      <div class="modal-header">
        <button id="be-back" class="be-back hidden">‹ Settings</button>
        <span class="modal-title" id="be-title">Settings</span>
        <span class="be-head-spacer"></span>
        <button id="modal-close" class="modal-close-btn">✕</button>
      </div>

      <!-- 1 · index. Rendered from SETTINGS_SECTIONS so the row and its
           current-state summary can never disagree about what exists. -->
      <div id="be-index"></div>

      <!-- 2 · section. One pane per section, all inside one scroll; the
           heading above them names whichever is active. -->
      <div id="be-panes" class="hidden">
        <div class="be-sec-head">
          <div class="be-sec-title" id="be-sec-title"></div>
          <div class="be-sec-desc" id="be-sec-desc"></div>
        </div>

        <section class="be-section" data-betab-panel="blocks">
          <div id="be-blocks-list" class="be-list"></div>
        </section>

        <!-- Named recurring periods — the time-axis counterpart of the
             location presets, bound to context tags in the ctx sheet. -->
        <section class="be-section" data-betab-panel="times">
          <div id="be-times-section"></div>
        </section>

        <section class="be-section" data-betab-panel="recurring">
          <div id="be-recurring-list" class="be-list"></div>
        </section>

        <!-- Occasions list only. A row opens #oc-sheet, the SAME editor the
             event on the day opens — see renderBeOccasions. -->
        <section class="be-section" data-betab-panel="occasions">
          <div id="be-occasions-list" class="be-list"></div>
        </section>

        <section class="be-section" data-betab-panel="areas">
          <div id="be-areas-list" class="be-list"></div>
          <div class="be-sub-head">Domains</div>
          <div id="be-domains-list" class="be-list"></div>
        </section>

        <section class="be-section" data-betab-panel="locations">
          <div id="be-loc-section"></div>
        </section>

        <section class="be-section" data-betab-panel="qr">
          <div id="be-qr-section"></div>
        </section>

        <section class="be-section" data-betab-panel="calendars">
          <div id="be-calendars-list" class="be-list"></div>
          <div class="be-list">
            <div class="be-set-row">
              <span class="be-set-name">Export</span>
              <button id="be-download-ics-btn" class="be-btn-secondary">Download .ics (8 weeks)</button>
            </div>
          </div>
          <div id="be-ics-status" class="be-push-status"></div>
        </section>

        <section class="be-section" data-betab-panel="metrics">
          <!-- List only, like every other settings section: the + row and the
               rows themselves open the shared sheet (SETTINGS_SHEETS.metric). -->
          <div id="be-metrics-list" class="be-list"></div>
        </section>

        <section class="be-section" data-betab-panel="config">
          <div id="be-config-list" class="be-list"></div>
          <div id="be-config-status" class="be-push-status"></div>
        </section>

        <section class="be-section" data-betab-panel="about">
          <div id="be-about" class="be-list"></div>
        </section>

        <section class="be-section" data-betab-panel="display">
          <div class="be-list">
            <div class="be-set-row">
              <span class="be-set-name">Theme</span>
              <button class="be-btn-secondary be-display-btn" id="theme-toggle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path id="theme-icon-moon" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                  <g id="theme-icon-sun" class="hidden">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                  </g>
                </svg>
                <span id="theme-label">Dark</span>
              </button>
            </div>
            <div class="be-set-row">
              <span class="be-set-name">Timezone</span>
              <select id="tz-select" class="be-tz-select"></select>
            </div>
            <div class="be-set-row">
              <span class="be-set-name">NOW panel</span>
              <button class="be-btn-secondary be-display-btn" id="panel-toggle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <g id="panel-icon-on">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </g>
                  <g id="panel-icon-off" class="hidden">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                  </g>
                </svg>
                <span id="panel-toggle-label">Panel</span>
              </button>
            </div>
          </div>
        </section>

      </div>
    </div>
  </div>

  <!-- 3 · sheet. Every settings datatype adds and edits in THIS object, with
       its own Save; it shares #clarify-sheet's geometry and z-layer, and the
       section behind it dims rather than scrolls. -->
  <div id="se-sheet-backdrop" class="hidden"></div>
  <div id="se-sheet" class="hidden"></div>

  <!-- The SCHEDULE PICKER: one dialog, three sources. It opens as a single rule
       and the type is a consequence of what gets answered — the Follows row at
       the top and Add a variation at the bottom are the only two controls that
       change what is stored, and nobody is asked to choose between a rule, a
       schedule and a derived source. Ported from Claude Design (project
       82343144-9c74-405a-8a03-5d1a2c5b82c7, file Schedule Picker.dc.html).
       Same geometry as #clarify-sheet, one layer above the settings sheet:
       Settings → Times is the only surface it opens from today. -->
  <div id="sp-sheet-backdrop" class="hidden"></div>
  <div id="sp-sheet" class="hidden"></div>

  <!-- THE global bar: one context-sensitive bottom bar for the whole app.
       Every overlay opens ABOVE it (bottom: var(--gbar-h)), so capture, undo,
       Clarify and the ≡ hub are one tap from anywhere — no floating chips.
       The input's MODE morphs (renderBar): bare inbox capture by default, a
       project/area target when a + affordance selects one (the ◉ chip names
       it; tap the chip to revert), "new log" on the Logs list. -->
  <div id="global-bar"></div>

  <!-- Nightly-fill countdown. Lives out here, not in the People tab, because
       the add/log forms are fixed overlays that sit above the tab and hid it
       during the only ten minutes it governs. -->
  <div id="people-timer" class="hidden"></div>

  <script src="/static/app.js"></script>
</body>
</html>
