<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gates</title>
  <link rel="icon" href="/static/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/gates.css">
</head>
<body class="gd-body">
  <!-- The app's top strip (8b), as links: this is its own document, and each
       path opens that page in the app. `/now` is the day itself, where a bare
       `/` would reopen the remembered page. -->
  <nav id="top-nav">
    <div class="tn-tabs">
      <a class="tn-tab" href="/now">Now</a>
      <a class="tn-tab" href="/calendar">Calendar</a>
      <a class="tn-tab" href="/projects">Projects</a>
      <a class="tn-tab" href="/lists">Lists</a>
      <a class="tn-tab" href="/log">Log</a>
      <a class="tn-tab" href="/tracking">Tracking</a>
      <a class="tn-tab on" href="/gates">Gates</a>
    </div>
    <a class="tn-icon tn-gear" href="/settings" title="Settings">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
    </a>
  </nav>
  <header id="gd-head">
    <h1>Gates</h1>
    <button id="gd-undo" class="gd-icon" title="Undo (Ctrl+Z)" disabled>↩</button>
    <button id="gd-reload" class="gd-icon" title="Re-read everything">↻</button>
  </header>
  <main id="gd-main">
    <section id="gd-money" class="gd-sec"></section>
    <section id="gd-day" class="gd-sec"></section>
    <section id="gd-gates" class="gd-sec"></section>
    <section id="gd-ledger" class="gd-sec"></section>
    <section id="gd-rules" class="gd-sec"></section>
  </main>
  <div id="gd-sheet-back" class="hidden"></div>
  <div id="gd-sheet" class="hidden" role="dialog" aria-modal="true"></div>
  <div id="gd-toast" class="hidden" role="status"></div>
  <script src="/static/gates.js"></script>
</body>
</html>
